{%extends 'base.html'%}
{%block title%}
Snippets
{%endblock%}

{%block content%}

<div class="container w-50">
    	<div class="raw gap-1 p-2 m-1">

            {%for snippet in snippets%}
              <div class="card m-1 card-bg">
                <h5 class="card-header primary-text">Snippet #{{snippet.id}}</h5>
                <div class="card-body">
                  <h5 class="card-title primary-text">{{snippet.title}}</h5>

                  <pre><code class="card-text language-{{snippet.language}}">{{snippet.content|truncatechars:200}}</code></pre>

                  <a href="{%url 'snippet_detail' id=snippet.id%}" class="btn btn-primary">See</a>
                </div>
              </div>
            {%endfor%}
        </div>

        
    </div>


{%endblock%}
