services:
  web:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - .:/app
      - ./data/staticfiles:/app/static
      - ./data/media:/app/media
    ports:
      - 8000:8000
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy/data:/data
      - ./data/caddy/config:/config
    ports:
      - 80:80
      - 443:443
    depends_on:
      - web