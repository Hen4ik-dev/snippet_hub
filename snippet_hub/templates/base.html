<!DOCTYPE html>

<html lang="en">

<head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.12.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.12.0/highlight.min.js"></script>

  <meta charset="utf-8">

  {# Blocks allows changing its content #}

  <link href="
https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css
" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <style>
        .primary-text {
            color: #FCF1D0;
        }
        .navbar-bg {
            background-color: #0c2358;
        }
        .card-bg {
            background-color: #05102b;
        }
        .copy-btn-bg {
            background-color: #FCF1D0;
        }
    </style>
</head>

<body style="background-color: #09142f;">

  {% block content %}{% endblock %}

https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js
"

</html>
